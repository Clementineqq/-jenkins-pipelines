services:
  app:
    image: ghcr.io/clementineqq/voidsounds:${IMAGE_TAG}   # pull из registry, не build. катим образ после CI (он передал SHA, compose подставил в image и docker pull взял нужный тег)
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-stagingpass}   # staging-дефолт временно, шобы не блокироваться, на проде - из секретов (TODO: вынести в credentials) 
      DB_NAME: ${DB_NAME:-voidsounds}
      SESSION_SECRET: ${SESSION_SECRET:-staging-secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stagingpass}
      POSTGRES_DB: ${DB_NAME:-voidsounds}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
